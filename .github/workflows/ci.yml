name: CI
on: [push, pull_request]
jobs:
  behavioral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - name: Release build and independent checks
        run: docker compose run --rm -T backtest bash run_regression.sh
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: docker compose -f compose.yaml -f compose.sanitizers.yaml run --rm -T backtest setarch x86_64 -R bash run_regression.sh asan
      - name: ThreadSanitizer including concurrent search
        run: docker compose -f compose.yaml -f compose.sanitizers.yaml run --rm -T backtest setarch x86_64 -R bash run_regression.sh tsan
